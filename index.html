}

updateTime();const alertSound = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg"); const signalTimes = ["20:02","20:08","20:14","20:20","20:28","20:38","20:41","20:55"]; let signals = [];

function buildSignalTimes() { signals = []; const now = new Date(); const base = new Date(); base.setSeconds(0); base.setMilliseconds(0); for (let d = -1; d <= 1; d++) { signalTimes.forEach(t => { const [h, m] = t.split(":".map(Number)); const s = new Date(base); s.setDate(base.getDate() + d); s.setHours(h, m); const e = new Date(s.getTime() + 60000); signals.push({ start: s, end: e }); }); } signals.sort((a, b) => a.start - b.start); }
